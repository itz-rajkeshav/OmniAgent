syntax = "proto3";

package omniagent;


service WhatsappService {
  rpc SaveAccount (SaveAccountRequest) returns (SaveAccountResponse);
  rpc UpdateAccountStatus (UpdateStatusRequest) returns (UpdateStatusResponse);
  rpc GetAccount (GetAccountRequest) returns (GetAccountResponse);
  rpc UpdateAgentMode (UpdateAgentModeRequest) returns (UpdateAgentModeResponse);
  rpc UpdateAgentTone (UpdateAgentToneRequest) returns (UpdateAgentToneResponse);
  rpc UpdateAgentSchedule (UpdateAgentScheduleRequest) returns (UpdateAgentScheduleResponse);
  rpc GetAgentSchedule (GetAgentScheduleRequest) returns (GetAgentScheduleResponse);
}

message ScheduleEntry {
  int32  day        = 1;
  string start_time = 2;
  string end_time   = 3;
  bool   is_enabled = 4;
}

message UpdateAgentScheduleRequest {
  string user_id                 = 1;
  repeated ScheduleEntry entries = 2;
}

message UpdateAgentScheduleResponse {
  bool   success = 1;
  string message = 2;
}

message GetAgentScheduleRequest {
  string user_id = 1;
}

message GetAgentScheduleResponse {
  bool   found                   = 1;
  repeated ScheduleEntry entries = 2;
}

message SaveAccountRequest {
  string user_id     = 1;
  string phone_number = 2;
  string jid         = 3;
}

message SaveAccountResponse {
  bool   success      = 1;
  string message      = 2;
  string phone_number = 3;
  string jid          = 4;
  string status       = 5;
  string agent_mode   = 6;
  string agent_tone   = 7;
}

message UpdateStatusRequest {
  string user_id = 1;
  string status  = 2;
  string jid     = 3;
}

message UpdateStatusResponse {
  bool   success = 1;
  string message = 2;
  string phone_number=3;
  string jid =4;
  string status =5;
  string agent_mode =6;
  string agent_tone =7;
}

message GetAccountRequest {
  string phone_number = 1;
}

message GetAccountResponse {
  bool   found        = 1;
  string user_id      = 2;
  string phone_number = 3;
  string jid          = 4;
  string status       = 5;
  string agent_mode   = 6;
  string agent_tone   = 7;
}

message UpdateAgentModeRequest {
  string user_id    = 1;
  string agent_mode = 2;
}

message UpdateAgentModeResponse {
  bool   success = 1;
  string message = 2;
  string agent_mode = 3;
  string agent_tone = 4;
}

message UpdateAgentToneRequest {
  string user_id    = 1;
  string agent_tone = 2;
}

message UpdateAgentToneResponse {
  bool   success = 1;
  string message = 2;
  string agent_tone = 3;
}