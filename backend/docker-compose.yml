services:
  redis:
    image: redis:7
    container_name: omniagent-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  agent-core:
    build: ./agent-core
    container_name: agent-core
    ports:
      - "8000:8000"
      - "50051:50051"
    # restart: unless-stopped
    volumes:
      - ./agent-core:/app
      - /app/.venv
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./agent-core/.env
    environment:
      - USE_SYSTEM_CHROMIUM=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  gateways:
    build: ./gateways
    container_name: gateways
    ports:
      - "3000:3000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      agent-core:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - AGENT_URL=http://agent-core:8000
      - AGENT_CORE_GRPC_ADDR=agent-core:50051
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./gateways:/app
      - /app/node_modules
      - ./proto:/app/proto
    # restart: unless-stopped
    command: npm run dev
